name: Playwright E2E Tests (CI/CD)

# Configurado apenas para acionamento manual (workflow_dispatch) para não executar
# automaticamente a cada push/PR, servindo como referência de esteira CI/CD de mercado.
# Para ativar execução automática no futuro, basta descomentar os blocos "push" e "pull_request".
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de execução dos testes E2E'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  # push:
  #   branches: [ main, master ]
  # pull_request:
  #   branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: E2E Regression Suite (Chromium)
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://automationpratice.com.br
      CI: true

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (LTS + Cache NPM)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: 3. Instalar Dependências Limpas (npm ci)
        run: npm ci

      - name: 4. Provisionar Navegador Playwright (Chromium Enxuto)
        run: npx playwright install --with-deps chromium

      - name: 5. Validar Tipagem Estática (Typecheck)
        run: npm run typecheck

      - name: 6. Executar Suíte Completa de Testes E2E Playwright
        run: npm test

      - name: 7. Publicar Relatório HTML e Traces (Artefato de Qualidade)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 15
